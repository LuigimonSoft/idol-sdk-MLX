name: PR checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (macOS ARM64)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check out pinned reference source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: speridlabs/idol-sdk
          ref: 4702a7f00850e34b6e83a2170cc123c3e9570744
          path: reference-upstream
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.14'
      - name: Install test dependencies
        run: |
          python -m pip install 'uv==0.12.1'
          uv pip install --system --require-hashes -r environments/reference.txt
      - name: Run unit tests
        env:
          IDOL_REFERENCE_SOURCE: ${{ github.workspace }}/reference-upstream
        run: |
          python -m unittest discover -s tests -v
      - name: Install MLX for backend parity tests
        run: uv pip install --system 'mlx==0.32.3'
      - name: Compare normalization layers with PyTorch on CPU
        env:
          IDOL_REFERENCE_SOURCE: ${{ github.workspace }}/reference-upstream
          IDOL_TEST_MLX_DEVICE: cpu
        run: python -m unittest discover -s tests -p 'test_layers_mlx.py' -v
